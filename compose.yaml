services:
  # Valkey for the integration tests of the valkey module:
  #   docker compose up -d --wait valkey
  #   go test -race -tags integration ./valkey/...
  valkey:
    image: valkey/valkey:8
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 30

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qumsg
      POSTGRES_PASSWORD: qumsg
      POSTGRES_DB: qumsg
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qumsg -d qumsg"]
      interval: 1s
      timeout: 1s
      retries: 30

  # Benchmarks with limited resources, closer to a production container than a
  # developer machine. Go >= 1.25 sets GOMAXPROCS from the CPU limit.
  #   docker compose run --rm bench
  #   BENCH_CPUS=4 BENCH=Parallel docker compose run --rm bench
  bench:
    image: golang:1.27
    working_dir: /src
    volumes:
      - .:/src:ro
      - go-cache:/root/.cache/go-build
    environment:
      GOFLAGS: -buildvcs=false
    cpus: ${BENCH_CPUS:-2}
    mem_limit: ${BENCH_MEMORY:-512m}
    command:
      - sh
      - -c
      - >-
        go test -run '^$$' -bench '${BENCH:-.}' -benchmem
        -count ${BENCH_COUNT:-5} ./...

volumes:
  go-cache:
