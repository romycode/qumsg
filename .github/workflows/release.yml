# Segunda mitad de un release. Al subir la etiqueta del núcleo (vX.Y.Z),
# sube el require de los módulos anidados, comprueba sus tests contra el
# núcleo publicado (sin go.work), etiqueta ambos sobre el mismo commit y
# termina creando la release de GitHub con las notas del CHANGELOG.
# Las etiquetas de módulos anidados no casan con el patrón.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # El núcleo es privado: sin proxy ni sumdb, y git autenticado con el
  # GITHUB_TOKEN (ver el paso "Acceso a módulos privados").
  GOPRIVATE: github.com/romycode/*

jobs:
  modules:
    name: Requires y etiquetas de los módulos anidados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Acceso a módulos privados
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: La etiqueta está en main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
            echo "::error::$GITHUB_REF_NAME no está en main"
            exit 1
          fi
          for module in valkey postgres; do
            if git rev-parse -q --verify "refs/tags/$module/$GITHUB_REF_NAME" >/dev/null; then
              echo "::error::$module/$GITHUB_REF_NAME ya existe"
              exit 1
            fi
          done
      - name: Subir el require
        env:
          GOWORK: "off"
        run: |
          for module in valkey postgres; do
            (cd "$module" && go get "github.com/romycode/qumsg@$GITHUB_REF_NAME" && go mod tidy)
          done
          git diff --stat
      - name: vet y tests contra el núcleo publicado
        env:
          GOWORK: "off"
        run: |
          for module in valkey postgres; do
            (cd "$module" && go vet ./... && go vet -tags integration ./... && go test -race ./...)
          done
      - name: Commit y etiqueta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add valkey/go.mod valkey/go.sum postgres/go.mod postgres/go.sum
            git commit -m "build: require qumsg $GITHUB_REF_NAME in transport modules"
          fi
          for module in valkey postgres; do
            git tag -a "$module/$GITHUB_REF_NAME" -m "$module $GITHUB_REF_NAME"
            echo "$module/$GITHUB_REF_NAME en $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          done
          git push --atomic origin HEAD:main "valkey/$GITHUB_REF_NAME" "postgres/$GITHUB_REF_NAME"
      - name: Release de GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notas: la sección de esta versión en CHANGELOG.md, hasta la siguiente.
          notes=$(awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f' CHANGELOG.md)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME ya existe" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "${notes:-Ver CHANGELOG.md}"
          fi
