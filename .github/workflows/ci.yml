# Lo mismo que `make check`: formato, go vet y tests unitarios y de
# integración de los dos módulos del workspace, con -race.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # El módulo valkey requiere el núcleo publicado (github.com/romycode/qumsg),
  # que es privado. Aunque go.work usa el directorio local, Go descarga el
  # go.mod de esa versión para construir el grafo de módulos: GOPRIVATE lo
  # pide directamente a GitHub (sin proxy ni sumdb) y el paso "Acceso a
  # módulos privados" autentica git con el GITHUB_TOKEN del workflow.
  GOPRIVATE: github.com/romycode/*

jobs:
  lint:
    name: Formato y vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: valkey/go.sum
      - name: Acceso a módulos privados
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: gofmt
        run: |
          files="$(gofmt -l *.go memory valkey)"
          if [ -n "$files" ]; then
            echo "Sin formatear:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./... ./valkey/...
          go vet -tags integration ./valkey/...

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 1s
          --health-timeout 1s
          --health-retries 30
    env:
      VALKEY_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: valkey/go.sum
      - name: Acceso a módulos privados
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: Unitarios
        run: go test -race ./... ./valkey/...
      - name: Integración (Valkey)
        run: go test -race -tags integration ./valkey/...
