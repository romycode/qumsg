# Lo mismo que `make check`: formato, go vet y tests unitarios y de
# integración de los tres módulos del workspace, con -race.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # El módulo valkey requiere el núcleo publicado (github.com/romycode/qumsg),
  # que es privado. Aunque go.work usa el directorio local, Go descarga el
  # go.mod de esa versión para construir el grafo de módulos: GOPRIVATE lo
  # pide directamente a GitHub (sin proxy ni sumdb) y el paso "Acceso a
  # módulos privados" autentica git con el GITHUB_TOKEN del workflow.
  GOPRIVATE: github.com/romycode/*

jobs:
  lint:
    name: Formato y vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            valkey/go.sum
            postgres/go.sum
      - name: Acceso a módulos privados
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: gofmt
        run: |
          files="$(gofmt -l *.go memory valkey postgres)"
          if [ -n "$files" ]; then
            echo "Sin formatear:"
            echo "$files"
            exit 1
          fi
      - name: go vet
        run: |
          go vet ./... ./valkey/... ./postgres/...
          go vet -tags integration ./valkey/... ./postgres/...

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      VALKEY_ADDR: localhost:6379
      POSTGRES_URL: postgres://qumsg:qumsg@localhost:5432/qumsg?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            valkey/go.sum
            postgres/go.sum
      - name: Acceso a módulos privados
        run: git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      # La misma imagen que compose.yaml. Se arranca a mano en vez de como
      # contenedor de servicio para poder probar otros registros si Docker
      # Hub falla (un servicio solo admite una imagen y aborta el job).
      - name: Arrancar Valkey
        run: |
          for image in valkey/valkey:8 mirror.gcr.io/valkey/valkey:8 public.ecr.aws/docker/library/valkey:8; do
            if docker pull -q "$image"; then
              echo "Imagen: $image"
              docker run -d --name valkey -p 6379:6379 "$image"
              break
            fi
            echo "::warning::No se pudo descargar $image"
          done
          if ! docker inspect valkey >/dev/null 2>&1; then
            echo "::error::Ningún registro sirvió la imagen de Valkey"
            exit 1
          fi
          for _ in $(seq 1 30); do
            if docker exec valkey valkey-cli ping 2>/dev/null | grep -q PONG; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Valkey no respondió a PING en 30 s"
          exit 1
      - name: Unitarios
        run: go test -race ./... ./valkey/... ./postgres/...
      - name: Arrancar PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Integración (Valkey)
        run: go test -race -tags integration ./valkey/...
      - name: Integración (PostgreSQL)
        run: go test -race -tags integration ./postgres/...
